<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walker</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas { display: block; cursor: none; }
      #reticle {
        position: fixed; left: 0; top: 0; width: 26px; height: 26px; margin: -13px 0 0 -13px;
        border: 2px solid #ffb347; border-radius: 50%; pointer-events: none; box-sizing: border-box;
      }
      #reticle::after { content: ''; position: absolute; inset: -9px; border: 2px solid #ff3030; transform: rotate(45deg) scale(0.6);
        opacity: 0; transition: opacity 0.12s, transform 0.12s; }
      #reticle.locked { border-color: #ff3030; }
      #reticle.locked::after { opacity: 1; transform: rotate(45deg) scale(1); animation: lockpulse 0.6s ease-in-out infinite alternate; }
      @keyframes lockpulse { to { transform: rotate(45deg) scale(0.82); } }
      #hud { position: fixed; right: 16px; top: 44px; text-align: right; font: 12px monospace; color: #ffb347; pointer-events: none; }
      #fps { position: fixed; right: 16px; top: 16px; font: 12px monospace; color: #ffb347; pointer-events: none; text-align: right; }
      .bar { width: 240px; height: 20px; border: 1px solid #ffb347; padding: 1px; margin: 2px 0 8px auto; }
      #lives { display: flex; align-items: center; justify-content: flex-end; gap: 6px; }
      #lives i { width: 10px; height: 10px; background: #ffb347; }
      .bar > div { height: 100%; width: 0; background: #ffb347; }
      #boss { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); display: none; gap: 10px; pointer-events: none; }
      #boss .seg { width: 180px; height: 12px; border: 1px solid #ff5a4a; box-sizing: border-box; }
      #boss .seg > div { height: 100%; width: 100%; background: #ff5a4a; }
      #boss .seg.shut { opacity: 0.4; }
      #flash { position: fixed; inset: 0; background: #fff6d8; opacity: 0; pointer-events: none; }
      #hit { position: fixed; inset: 0; background: radial-gradient(transparent 40%, rgba(255,0,0,0.6)); opacity: 0; pointer-events: none; }
      #go { position: fixed; left: 40px; top: 45%; font: bold 40px monospace; color: #ffb347; display: none; pointer-events: none;
        animation: blink 0.8s steps(2) infinite; text-shadow: 0 0 10px #ff8c00; }
      @keyframes blink { 50% { opacity: 0.15; } }
      #over { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
        font-family: monospace; color: #ffb347; user-select: none; cursor: default;
        background: radial-gradient(ellipse at 50% 50%, rgba(40,0,0,0.45) 0%, rgba(2,6,10,0.8) 100%); }
      body.gameover #reticle { display: none; }
      #over h2 { margin: 0 0 40px; font-size: clamp(40px, 7vw, 88px); letter-spacing: 0.2em; padding-left: 0.2em; color: #ff5a4a;
        text-shadow: 0 0 22px rgba(255,60,30,0.6), 4px 4px 0 #3a0a00; }
      /* ---- main menu: over the first level's skyline ---- */
      #menu { position: fixed; inset: 0; display: none; font-family: monospace; color: #ffb347; user-select: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(2,6,10,0.15) 0%, rgba(2,6,10,0.72) 100%); }
      body.menu #menu { display: block; }
      body.menu #hud, body.menu #boss, body.menu #reticle, body.menu #fps, body.menu #hit, body.menu #flash, body.menu #go, body.menu #over { display: none; }
      #menu-main { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
      #menu h1 { margin: 0; }
      #menu h1 img { display: block; margin: 0 auto; width: clamp(338px, 41.6vw, 624px); height: auto; filter: drop-shadow(0 0 18px rgba(255,140,0,0.35)); }
      #menu .tag { margin: 6px 0 40px; font-size: 14px; letter-spacing: 0.08em; opacity: 0.65; }
      .menu-items { list-style: none; margin: 0; padding: 0; }
      .menu-items li { margin: 0 auto 14px; padding: 8px 40px; position: relative; cursor: pointer; width: fit-content; min-width: 280px;
        font-size: 22px; letter-spacing: 0.14em; border: 2px solid transparent; }
      .menu-items li::before { content: '\25B6'; position: absolute; left: 14px; opacity: 0; }
      .menu-items li.sel { border-color: #ffb347; background: rgba(255,179,71,0.12); text-shadow: 0 0 10px rgba(255,140,0,0.7); }
      .menu-items li.sel::before { opacity: 1; }
      .menu-items li:hover { border-color: #ffb347; }
      /* ---- pause menu: over the frozen game ---- */
      #pause { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
        font-family: monospace; color: #ffb347; user-select: none; background: rgba(2,6,10,0.6); cursor: default; }
      body.paused #pause { display: flex; }
      body.paused #reticle { display: none; }
      #pause h2 { margin: 0 0 32px; font-size: 40px; letter-spacing: 0.2em; text-shadow: 0 0 14px rgba(255,140,0,0.55); }
      #menu-note { min-height: 20px; margin: 18px 0 0; font-size: 14px; opacity: 0; transition: opacity 0.25s; color: #ffd9a0; }
      #menu-note.on { opacity: 0.9; }
      #kofi { position: absolute; right: 24px; bottom: 24px; width: 148px; text-align: center; text-decoration: none; color: #ffd9a0;
        font-size: 12px; line-height: 1.35; letter-spacing: 0.03em; }
      #kofi img { display: block; width: 148px; height: 148px; image-rendering: pixelated; background: #fff; }
      #kofi span { display: block; margin-top: 8px; }
    </style>
  </head>
  <body class="menu">
    <div id="hud">
      <div>SHIELD</div><div class="bar"><div id="shield"></div></div>
      <div>HEAT</div><div class="bar"><div id="heat"></div></div>
      <div id="lives"></div>
      <div id="quality" style="margin-top:8px;opacity:.6">Q: post-fx on  |  H: haze</div>
    </div>
    <div id="boss"><div class="seg"><div></div></div><div class="seg"><div></div></div></div>
    <div id="fps">-- FPS</div>
    <div id="flash"></div>
    <div id="hit"></div>
    <div id="go">&#9668; GO</div>
    <div id="over">
      <h2>GAME OVER</h2>
      <ul class="menu-items">
        <li data-action="retry">RETRY</li>
        <li data-action="quit">BACK TO MAIN MENU</li>
      </ul>
    </div>
    <div id="reticle"></div>
    <div id="pause">
      <h2>PAUSED</h2>
      <ul class="menu-items">
        <li data-action="resume">RESUME</li>
        <li data-action="quit">BACK TO MAIN MENU</li>
      </ul>
    </div>
    <div id="menu">
      <div id="menu-main">
        <h1><img src="deathwalker-headline.png" alt="DEATHWALKER" /></h1>
        <p class="tag">a browser remake inspired by Walker (1993)</p>
        <ul id="menu-items" class="menu-items">
          <li data-action="start">START GAME</li>
          <li data-action="code">ENTER LEVEL CODE</li>
          <li data-action="fame">HALL OF FAME</li>
          <li data-action="credits">CREDITS</li>
        </ul>
        <p id="menu-note"></p>
      </div>
      <a id="kofi" href="https://ko-fi.com/huuuda" target="_blank" rel="noopener">
        <img src="kofi-qr.svg" alt="QR code for ko-fi.com/huuuda" />
        <span>Enjoying this remake? Help me make more!</span>
      </a>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
